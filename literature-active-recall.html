const items=[
["Plot 与 Action 的关系是什么？用英文给出 Plot 定义。","Plot is the organized sequence of events and actions in a literary work, often linked by causal relationships. Actions are constituents of plot.","Plot · action · causality"],
["What is the difference between story and plot?","A story recounts events in chronological order, while plot emphasizes the causal connections and arrangement of events.","story · plot"],
["Define omniscient point of view.","An omniscient narrator can report the thoughts, feelings and actions of multiple characters and may move across times and places.","narrator · knowledge"],
["Define third-person limited point of view.","The narrator uses the third person but restricts access to the consciousness or perspective of one focal character.","third person · restricted perspective"],
["How does objective point of view differ from limited point of view?","Objective narration generally presents dialogue and observable actions without directly revealing characters' thoughts; limited narration may reveal one character's mind.","objective · limited"],
["What is a psychological novel?","A psychological novel focuses on characters' inner thoughts, emotions, motivations and psychological development.","psychological novel"],
["What is psychological realism?","Psychological realism realistically represents the complex perceptions, thoughts and motivations of characters, emphasizing reality as experienced through consciousness.","psychological realism"],
["Distinguish psychological novel from psychological realism.","The former is a type of novel focused on inner life; the latter is a literary approach to portraying psychological experience realistically. One work may be both.","genre · approach"],
["Define psychoanalytic criticism.","Psychoanalytic criticism uses psychoanalytic theories to interpret literary texts, exploring unconscious desires, repression, conflicts and symbolism.","Freud · unconscious"],
["What are Intentional Fallacy and Affective Fallacy?","Intentional Fallacy treats the author's intended meaning as the final standard; Affective Fallacy treats readers' emotional effects as the standard for interpreting or evaluating a work. Both are criticized by Wimsatt and Beardsley.","New Criticism"],

const items=[
["Plot 与 Action 的关系是什么？用英文给出 Plot 定义。","Plot is the organized sequence of events and actions in a literary work, often linked by causal relationships. Actions are constituents of plot.","Plot · action · causality"],
["What is the difference between story and plot?","A story recounts events in chronological order, while plot emphasizes the causal connections and arrangement of events.","story · plot"],
["Define omniscient point of view.","An omniscient narrator can report the thoughts, feelings and actions of multiple characters and may move across times and places.","narrator · knowledge"],
["Define third-person limited point of view.","The narrator uses the third person but restricts access to the consciousness or perspective of one focal character.","third person · restricted perspective"],
["How does objective point of view differ from limited point of view?","Objective narration generally presents dialogue and observable actions without directly revealing characters' thoughts; limited narration may reveal one character's mind.","objective · limited"],
["What is a psychological novel?","A psychological novel focuses on characters' inner thoughts, emotions, motivations and psychological development.","psychological novel"],
["What is psychological realism?","Psychological realism realistically represents the complex perceptions, thoughts and motivations of characters, emphasizing reality as experienced through consciousness.","psychological realism"],
["Distinguish psychological novel from psychological realism.","The former is a type of novel focused on inner life; the latter is a literary approach to portraying psychological experience realistically. One work may be both.","genre · approach"],
["Define psychoanalytic criticism.","Psychoanalytic criticism uses psychoanalytic theories to interpret literary texts, exploring unconscious desires, repression, conflicts and symbolism.","Freud · unconscious"],
["What are Intentional Fallacy and Affective Fallacy?","Intentional Fallacy treats the author's intended meaning as the final standard; Affective Fallacy treats readers' emotional effects as the standard for interpreting or evaluating a work. Both are criticized by Wimsatt and Beardsley.","New Criticism"],
["What is the Heresy of Paraphrase?","Cleanth Brooks argues that a poem cannot be adequately reduced to a prose paraphrase because form and language are inseparable from its meaning.","Cleanth Brooks"],
["Explain organic unity in New Criticism.","The language, imagery, irony, tension and structure of a literary work function together as an integrated whole.","New Criticism"],
["What is a quatrain?","A quatrain is a four-line stanza or poem, often with a regular rhyme scheme such as ABAB or ABBA.","poetic form"],
["What is a quintain?","A quintain is a stanza of five lines.","poetic form"],
["What is poetic justice?","Poetic justice is the literary distribution of rewards and punishments according to characters' moral virtue or vice.","virtue · vice"],
["What is prose poetry?","Prose poetry combines poetic features such as rhythm, imagery and compression with prose-style sentences and paragraphs rather than verse line breaks.","poetry · prose"],
["Who wrote The Portrait of a Lady, and what is Isabel Archer's main conflict?","Henry James. Isabel's desire for independence clashes with social expectations, marriage, and the consequences of her choices.","Henry James"],
["Who are Clarissa Dalloway and Septimus Warren Smith?","They are central characters in Virginia Woolf's Mrs Dalloway. Clarissa reflects on memory and life, while Septimus struggles with war trauma.","Virginia Woolf"],
["What is the central concern of Notes from Underground?","Dostoevsky's underground man explores alienation, excessive self-consciousness, irrationality, and free will in conflict with rational self-interest.","Dostoevsky"],
["What is a pun?","A pun is wordplay based on multiple meanings of one word or similarities in sound between words.","rhetoric"]
,["What is the central conflict in a plot?","Conflict is the struggle between opposing forces, either internal or external, which often drives the development of the plot.","Plot · conflict · 教材47页"],
["Name the five conventional stages of plot.","Exposition, rising action, climax, falling action, and resolution (or dénouement).","Plot · stages · 教材47页"],
["Define point of view. Distinguish narrator from focalizer.","Point of view concerns the perspective through which a narrative is told or perceived. A narrator speaks, while a focalizer is the consciousness through which events are perceived.","POV · 教材48页"],
["Give a first-person narrator who is not the protagonist.","Nick Carraway narrates The Great Gatsby, but Jay Gatsby is the central character.","The Great Gatsby · 教材48页"],
["What is an unreliable narrator?","A narrator whose account or interpretation cannot be fully trusted because of limitations, bias, or misrepresentation.","narratology · extension"],
["Explain what poetry concerns beyond what is said.","Poetry is concerned not only with what is said but with how it is said: rhythm, imagery, diction, form and sound shape its effects.","Poetry · 教材47页"],
["How does free verse differ from prose poetry?","Free verse typically uses line breaks without fixed meter; prose poetry uses prose paragraphs while retaining poetic devices.","Prose poetry · 教材47页"],
["What are poems of chance associated with?","Poems of chance are associated with Dadaism and incorporate random selection or arrangement of words.","Dadaism · 教材47页"],
["Define poetics and name Aristotle's major work.","Poetics studies principles of literary composition and form. Aristotle's Poetics discusses mimesis, plot, tragedy and catharsis.","Poetics · 教材47页"],
["What is a poet laureate?","A poet officially honored or appointed in recognition of literary achievement; in Britain the Poet Laureate is appointed by the monarch.","Poet Laureate · 教材47页"],
["Define a psalm. Does it only express praise?","A psalm is a sacred song or lyric poem, especially in the biblical Book of Psalms; it may express praise, prayer, thanksgiving or lament.","Psalm · 教材49页"],
["Why is the protagonist not necessarily a hero?","The protagonist is the central character around whom the main action or conflict develops; the character need not be morally admirable.","Protagonist · 教材49页"],
["Define Pre-Romanticism and give one example.","Pre-Romanticism refers to eighteenth-century tendencies emphasizing emotion, imagination, nature, the medieval past and the Gothic; e.g. Gray's Elegy or Walpole's The Castle of Otranto.","Pre-Romanticism · 教材49页"],
["Give three common features of literary postmodernism.","Metafiction, intertextuality, fragmentation, parody or self-reflexivity are common features; not all works display every feature.","Postmodernism · 教材48–49页"],
["Define Realism in literature.","Realism seeks credible, detailed representation of ordinary life, social conditions and human behavior, often reacting against romantic idealization.","Realism · 教材49页"],
["Distinguish psychological realism from stream of consciousness.","Psychological realism aims at credible portrayal of complex mental life; stream of consciousness is a technique for presenting the flow of consciousness.","psychological realism · extension"],
["Who is Rebecca Sharp, and why is Thackeray's portrayal psychological?","Rebecca Sharp is a central character in Vanity Fair; her ambitions, calculations and motives are portrayed with psychological complexity.","Thackeray · 教材49页"],
["Why is Henry James associated with psychological realism?","James explores reality through characters' perceptions and judgments rather than treating external facts alone as sufficient.","Henry James · 教材49页"],
["What is Lambert Strether's role in The Ambassadors?","He is the central consciousness through which Henry James presents changing perceptions and moral judgments.","The Ambassadors · Henry James"],
["What happens to Isabel Archer in The Portrait of a Lady?","She inherits money, marries Gilbert Osmond, becomes disillusioned by his control and deceit, and ultimately returns to Rome.","The Portrait of a Lady · 近期复习"],
["What does Mrs Dalloway juxtapose through Clarissa and Septimus?","Clarissa's social life and reflections on time and mortality contrast with Septimus's war trauma and death, revealing connections between private consciousness and society.","Mrs Dalloway · 近期复习"],
["Why does the Underground Man act against his own interests?","He resists a purely rational account of human conduct, insisting on free will even when his choices are destructive.","Notes from Underground · 近期复习"],
["Define New Criticism in two sentences.","New Criticism emphasizes close reading of the literary text as a relatively autonomous verbal work. It examines formal tensions, irony, paradox and organic unity.","New Criticism · 近期复习"],
["Who wrote The New Criticism (1941)?","John Crowe Ransom.","New Criticism · critic"],
["Who wrote The Well Wrought Urn (1947)?","Cleanth Brooks, who discussed paradox, organic unity and the heresy of paraphrase.","New Criticism · critic"],
["What does Intentional Fallacy mean?","Wimsatt and Beardsley argued that an author's intended meaning should not be treated as the definitive standard of textual interpretation or evaluation.","New Criticism · fallacy"],
["What does Affective Fallacy mean?","Wimsatt and Beardsley warned against equating a poem with its emotional or psychological effects on readers.","New Criticism · fallacy"],
["Explain the difference between paradox and irony.","Paradox is an apparently self-contradictory statement suggesting a truth; irony involves a contrast between apparent or expected and actual meaning or outcome.","rhetoric · 易混"],
["Define litotes and give an example.","Litotes is understatement by negating the opposite, such as 'not bad' for 'good'.","rhetoric · 易混"],
["Distinguish alliteration, assonance and consonance.","Alliteration repeats initial consonant sounds; assonance repeats vowel sounds; consonance repeats consonant sounds, often elsewhere in words.","sound devices · 易混"],
["Distinguish antithesis from paradox.","Antithesis juxtaposes contrasting ideas in parallel structure; paradox makes an apparently contradictory statement that suggests truth.","rhetoric · 易混"],
["What is a national tale, and how does it differ from a folktale?","A national tale is a prose fiction emphasizing national identity, regional customs and cultural differences; a folktale is a traditional narrative transmitted through folklore.","national tale · 近期复习"],
["Which American novelist wrote the Leatherstocking Tales?","James Fenimore Cooper; the cycle includes The Last of the Mohicans.","American literature · 近期复习"],
["What is the difference between biblical doctrine and Roman Catholicism?","Biblical doctrine means teachings drawn from the Bible; Roman Catholicism names a major Christian religious tradition, not a synonym for biblical doctrine.","terminology · 近期复习"],
["How does a quatrain differ from a heroic couplet?","A quatrain is a four-line stanza; a heroic couplet is two rhymed lines, typically in iambic pentameter.","verse form · 易混"],

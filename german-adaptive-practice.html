:root{color-scheme:light}*{box-sizing:border-box}html,body{background:#fff!important;color:#2d2137!important}body{margin:0;font:15px/1.65 system-ui,-apple-system,sans-serif}main{max-width:730px;margin:auto;padding:19px 16px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top a{color:#603880;text-decoration:none}.pill{font-size:12px;background:#f3e7fa;color:#5c3278;padding:5px 10px;border-radius:99px}h1{font-size:24px;margin:22px 0 5px;line-height:1.3}p{margin:5px 0 17px;color:#766b7f}.card{border:1px solid #e4d8eb;background:white!important;border-radius:18px;padding:19px;margin:14px 0}.progress{display:flex;justify-content:space-between;gap:12px;color:#796d80;font-size:12px}.question{font-size:19px;font-weight:700;line-height:1.55;margin:18px 0}.option{width:100%;display:block;text-align:left;border:1px solid #e6dbeb;background:#fff;color:#2d2137;border-radius:11px;margin:8px 0;padding:11px 13px;font:inherit;cursor:pointer}.option.selected{background:#f5eafd;border-color:#7c499b}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}button.primary{background:#603782;border-color:#603782;color:white}button{font:inherit;border:1px solid #d7c5df;padding:10px 13px;border-radius:11px;background:#fff;color:#603782;cursor:pointer}button:disabled{opacity:.45;cursor:default}textarea{width:100%;min-height:115px;border-radius:10px;background:#fff!important;color:#2d2137!important;border:1px solid #d7c5df;padding:12px;font:inherit;resize:vertical}.explain{display:none;padding:15px;border-radius:12px;background:#f8f1fc;margin-top:13px;white-space:pre-wrap}.explain.show{display:block}.feedback{font-weight:700;margin-bottom:6px}.meta{font-size:12px;color:#7a6d82}.strip{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.strip span{background:#f7f0f9;padding:7px 11px;border-radius:9px;font-size:12px;color:#5f4670}.extras{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:25px}.extras a{color:#674389}.foot{font-size:12px;color:#80 </style></head><body><main><div class="top"><a href="./">← 返回首页</a><span class="pill">A2 → B1 · 直接做题</span></div><h1>二外德语｜今日训练</h1><p>基于近期对话练习中的题目和已学搭配编排。优先主动提取；答对延后，答错和模糊的题重新出现。</p><div class="strip"><span id="total"></span><span id="error"></span><span id="due"></span></div><section class="card"><div class="progress"><span id="progress"></span><span id="source"></span></div><div class="question" id="question"></div><div id="options"></div><textarea id="input" placeholder="请直接用德语作答；翻译题可自行评价，系统不假装能自动判断所有同义答案" hidden></textarea><div class="controls"><button id="check" class="primary" disabled>提交答案</button><button id="skip">跳过这题</button></div><div class="explain" id="explain"><div class="feedback" id="feedback"></div><div id="reference"></div><div class="controls"><button id="retry">× 仍不会</button><button id="partial">△ 部分掌握</button><button class="primary" id="master">✓ 已掌握 / 下一题</button></div></div><div class="meta" style="margin-top:13px">选择题提交后自动判分；开放题参考答案仅供对照，需自行判断掌握程度。</div></section><div class="extras"><a href="./german-close-reading.html">课本精读</a><a href="./german-phrases-quick500.html">词组复习</a><a href="./german-writing.html">作文模板</a><a href="./ucass2027-v6-7-integrated-ready.html">原完整题库</a></div><div class="foot">题源：近期聊天中提供的德语练习和已学考点，非声称从教材逐页摘出的原题。本模块使用独立的浏览器本地记录，不会覆盖原 V6.7 记录，也尚不能从聊天或其他设备实时读取成绩。</div></main><script>
const items=[{"id":"de-r01","kind":"mc","topic":"形容词名词化","q":"Ich habe dir etwas ___ zu erzählen.","options":["Neue","Neues","Neuen","Neuem"],"correct":1,"ex":"etwas 后接名词化形容词，中性单数强变化词尾 -es：etwas Neues。","source":"近期填空练习"},{"id":"de-r02","kind":"mc","topic":"形容词名词化","q":"Zum Geburtstag wünsche ich dir alles ___.","options":["Gute","Guten","Gutes","Gutem"],"correct":0,"ex":"固定表达 alles Gute；alles 在这里搭配名词化形容词 Gute。","source":"近期填空练习"},{"id":"de-r03","kind":"mc","topic":"最高级","q":"Hangzhou ist ___ der berühmtesten Städte.","options":["eine","eines","einer","einen"],"correct":0,"ex":"杭州是一座城市，eine der + 复数第二格，后面是 der berühmtesten Städte。","source":"近期填空练习"},{"id":"de-r04","kind":"mc","topic":"最高级","q":"Markus ist ___ der fleißigsten Schüler.","options":["eine","einen","einer","eines"],"correct":2,"ex":"Markus 阳性第一格，einer der fleißigsten Schüler，表示最勤奋的学生之一。","source":"近期填空练习"},{"id":"de-r05","kind":"mc","topic":"弱变化与格","q":"Sie spielt mit den ___.","options":["Kinder","Kindern","Kindes","Kind"],"correct":1,"ex":"mit 支配第三格，复数第三格名词通常加 -n：mit den Kindern。","source":"近期填空练习"},{"id":"de-r06","kind":"mc","topic":"弱变化","q":"Das ist das Fahrrad des ___.","options":["Manns","Mannes","Mannen","Mann"],"correct":1,"ex":"Mann 是强变化阳性名词，第二格单数 des Mannes；不要误套弱变化。","source":"近期填空练习"},{"id":"de-r07","kind":"mc","topic":"人称代词","q":"Ich gebe dem Kind das Buch. → Ich gebe ___.","options":["es ihm","ihn ihm","ihm es","ihn es"],"correct":0,"ex":"两个宾语都用代词时通常第四格代词在第三格代词之前：Ich gebe es ihm。","source":"近期填空练习"},{"id":"de-r08","kind":"mc","topic":"关系从句","q":"In Deutschland gibt es viele Großstädte, ___ auch Düsseldorf gehört.","options":["zu denen","an denen","in die","von denen"],"correct":0,"ex":"gehören zu + Dativ；关系代词指 Großstädte（复数），因此 zu denen。","source":"近期填空练习"},{"id":"de-r09","kind":"mc","topic":"情态动词","q":"Ich glaube, dass man im Museum nicht fotografieren ___.","options":["dürfen","darf","dürfte","gedurft"],"correct":1,"ex":"从句动词末位，man 是三单：dass man ... nicht fotografieren darf。","source":"近期填空练习"},{"id":"de-r10","kind":"mc","topic":"代词性别","q":"Das Museum ist sehr alt. Wir besuchen ___ morgen.","options":["ihn","es","sie","ihm"],"correct":1,"ex":"das Museum 是中性，besuchen 支配第四格，所以 es。","source":"近期填空练习"},{"id":"de-r11","kind":"mc","topic":"代词性别","q":"Der Roman ist spannend. Ich lese ___ gerade.","options":["ihn","ihm","es","sie"],"correct":0,"ex":"der Roman 阳性第四格用 ihn。","source":"近期填空练习"},{"id":"de-r12","kind":"mc","topic":"搭配","q":"Die Regierung stellt zusätzliche finanzielle Mittel ___.","options":["an","bereit","vor","auf"],"correct":1,"ex":"etw. bereitstellen = 提供、拨出；stellt ... bereit 是可分动词。","source":"近期词组讨论"},{"id":"de-r13","kind":"mc","topic":"搭配","q":"Der Unterschied ___ A und B ist deutlich.","options":["zu","zwischen","von","gegen"],"correct":1,"ex":"der Unterschied zwischen A und B；也可说 ein Unterschied zu + D。","source":"近期词组讨论"},{"id":"de-r14","kind":"mc","topic":"介词搭配","q":"Er nimmt Rücksicht ___ seine Nachbarn.","options":["mit","an","auf","über"],"correct":2,"ex":"Rücksicht nehmen auf + Akkusativ。","source":"已学搭配复习"},{"id":"de-r15","kind":"mc","topic":"不定式","q":"Es ist an der Zeit, etwas ___.","options":["tun","zu tun","getan","tut"],"correct":1,"ex":"Es ist an der Zeit, etwas zu tun. 表示该做某事了。","source":"近期表达讨论"},{"id":"de-r16","kind":"mc","topic":"时态和搭配","q":"Die Frist ___ morgen ab.","options":["läuft","ist","wird","hat"],"correct":0,"ex":"ablaufen 为可分动词：Die Frist läuft morgen ab（期限明天届满）。","source":"近期表达讨论"},{"id":"de-r17","kind":"mc","topic":"固定搭配","q":"Er hat Vertrauen ___ die neue Methode.","options":["mit","in","aus","bei"],"correct":1,"ex":"Vertrauen in + Akkusativ haben；Vertrauen fassen = 建立信任。","source":"已学搭配复习"},{"id":"de-r18","kind":"mc","topic":"代词反身","q":"Man sollte täglich ausreichend Wasser zu ___ nehmen.","options":["sich","ihm","sie","ihnen"],"correct":0,"ex":"etw. zu sich nehmen = 摄入、吃喝；这里 sich 是反身代词，与 man 对应。","source":"近期表达讨论"},{"id":"de-r19","kind":"mc","topic":"词义辨析","q":"哪一个表示“从……得出／产生结果”？","options":["sich aus + D ergeben","sich an + A erinnern","sich mit + D beschäftigen","sich auf + A freuen"],"correct":0,"ex":"sich aus + D ergeben 意为从某事中得出、产生。","source":"已学搭配复习"},{"id":"de-r20","kind":"mc","topic":"词义辨析","q":"Die Frist ist um. 最接近哪句话？","options":["Die Frist hat begonnen.","Die Frist ist abgelaufen.","Die Frist wird verlängert.","Es gibt keine Frist."],"correct":1,"ex":"Die Frist ist um = 期限到了/结束了；ist abgelaufen 也表示期限已经届满。","source":"近期表达讨论"},{"id":"de-r21","kind":"input","topic":"句型输出","q":"翻译成德语：这本小说很有趣。我正在读它。（用 Roman / spannend）","answers":["Der Roman ist spannend. Ich lese ihn gerade.","Der Roman ist spannend; ich lese ihn gerade."],"ex":"关键是 der Roman 为阳性，第四格代词 ihn。答案允许同义表达，自评即可。","source":"近期翻译练习"},{"id":"de-r22","kind":"input","topic":"搭配输出","q":"用德语写出“向某人提供某物”的一个搭配（以 bereitstellen 为核心）。","answers":["jdm. etw. bereitstellen","jemandem etwas bereitstellen","etw. bereitstellen"],"ex":"常用结构：jdm. etw. bereitstellen；例如 Die Regierung stellt den Schulen Mittel bereit。","source":"近期构词讨论"},{"id":"de-r23","kind":"input","topic":"句型输出","q":"翻译成德语：现在是采取行动的时候了。","answers":["Es ist an der Zeit, zu handeln.","Es ist Zeit zu handeln."],"ex":"Es ist an der Zeit, zu handeln. / Es ist Zeit zu handeln. 均可。","source":"近期表达讨论"},{"id":"de-r24","kind":"input","topic":"句型输出","q":"将句子改写成 dass 从句：Man darf im Museum nicht fotografieren.（主句 Ich glaube, ...）","answers":["Ich glaube, dass man im Museum nicht fotografieren darf."],"ex":"从句动词 darf 放在末尾，主句末尾逗号后接 dass。","source":"近期填空练习"},{"id":"de-r25","kind":"input","topic":"翻译输出","q":"翻译成德语：政府提供额外的财政资金。","answers":["Die Regierung stellt zusätzliche finanzielle Mittel bereit."],"ex":"stellen + bereit 可分；zusätzliche finanzielle Mittel 为复数第四格。","source":"近期词组讨论"},{"id":"de-r26","kind":"input","topic":"句型输出","q":"写出“德国有许多大城市，杜塞尔多夫也属于其中”的德语句子。","answers":["In Deutschland gibt es viele Großstädte, zu denen auch Düsseldorf gehört."],"ex":"关系从句关键：zu denen + 复数第三格，动词 gehört 置末尾。","source":"近期填空练习"},{"id":"de-r27","kind":"input","topic":"表达辨析","q":"写出“从明天起”的两种德语表达。","answers":["ab morgen; von morgen an","von morgen an; ab morgen"],"ex":"ab morgen 和 von morgen an 都可表达从明天开始。","source":"近期时间表达讨论"},{"id":"de-r28","kind":"input","topic":"固定搭配","q":"写出“考虑到／照顾某人”的德语动名词搭配与介词。","answers":["Rücksicht auf jemanden nehmen","Rücksicht nehmen auf + Akkusativ"],"ex":"Rücksicht auf jdn. nehmen；其中 auf 支配第四格。","source":"已学搭配复习"}];
const KEY='ucass_german_adaptive_v1',session=new Set();let record={};try{record=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
let current=null,chosen=-1,submitted=false;const el=id=>document.getElementById(id);const day=()=>new Date().toLocaleDateString('sv-SE');function save(){try{localStorage.setItem(KEY,JSON.stringify(record))}catch(e){}}
function stats(){const a=Object.values(record);el('total').textContent='已评价 '+a.length+'/'+items.length;el('error').textContent='待巩固 '+a.filter(x=>x.rating!=='know').length;el('due').textContent='待复习 '+items.filter(x=>!record[x.id]||record[x.id].next<=day()).length}
function choose(){let pool=items.filter(x=>!session.has(x.id)&&(!record[x.id]||record[x.id].next<=day()));if(!pool.length){session.clear();pool=items.filter(x=>!record[x.id]||record[x.id].next<=day());if(!pool.length)pool=items.slice()}pool.sort((a,b)=>{const score=x=>!record[x.id]?0.5:record[x.id].rating==='miss'?0:record[x.id].rating==='partial'?0.25:1;return score(a)-score(b)});return pool[0]}
function render(){current=choose();session.add(current.id);chosen=-1;submitted=false;el('progress').textContent='第 '+(items.findIndex(x=>x.id===current.id)+1)+' / '+items.length+' 题 · '+current.topic;el('source').textContent=current.source;el('question').textContent=current.q;el('explain').classList.remove('show');el('options').innerHTML='';el('input').hidden=current.kind!=='input';el('input').value='';el('check').disabled=true;el('check').hidden=false;if(current.kind==='mc')current.options.forEach((v,i)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+v;b.onclick=()=>{chosen=i;document.querySelectorAll('.option').forEach((o,j)=>o.classList.toggle('selected',j===i));el('check').disabled=false};el('options').appendChild(b)});stats()}
el('input').oninput=()=>{el('check').disabled=!el('input').value.trim()};el('skip').onclick=()=>{record[current.id]=record[current.id]||{rating:'miss',next:day(),times:0};save();render()};
el('check').onclick=()=>{if(submitted)return;submitted=true;el('check').hidden=true;el('explain').classList.add('show');let ok=current.kind==='mc'&&chosen===current.correct;el('feedback').textContent=current.kind==='mc'?(ok?'✓ 回答正确':'× 回答错误'):'请对照参考答案自行评分';el('reference').textContent=(current.kind==='mc'?'正确答案：'+String.fromCharCode(65+current.correct)+'. '+current.options[current.correct]:'参考答案：'+current.answers.join(' / '))+'\n\n解析：'+current.ex;if(current.kind==='mc'){el('master').textContent=ok?'✓ 掌握 / 下一题':'✓ 我已理解 / 下一题'}else el('master').textContent='✓ 已掌握 / 下一题'};
function mark(rating){const prev=record[current.id]||{times:0,streak:0};const streak=rating==='know'?(prev.streak||0)+1:0;const days=rating==='know'?Math.min(21,streak===1?2:Math.round(Math.pow(2,streak))):rating==='partial'?1:0;const next=new Date();next.setDate(next.getDate()+days);record[current.id]={rating,streak,times:(prev.times||0)+1,next:next.toLocaleDateString('sv-SE'),last:Date.now()};save();render()}
el('retry').onclick=()=>mark('miss');el('partial').onclick=()=>mark('partial');el('master').onclick=()=>mark('know');render();
</script></body></html>

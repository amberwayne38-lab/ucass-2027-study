<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UCASS 2027 · 四科训练</title><style>
:root{color-scheme:dark;--bg:#0d1321;--panel:#1b2944;--line:#52617d;--txt:#f2f5fc;--muted:#bdc9dc;--accent:#8bd6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,'Noto Sans SC',sans-serif;line-height:1.6}header{padding:24px 18px;background:#14213a;border-bottom:1px solid #364765}main{max-width:850px;margin:auto;padding:16px}h1{font-size:25px;margin:0 0 4px}h2{font-size:22px;margin:12px 0}h3{font-size:17px;margin:10px 0}p{margin:8px 0}small,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card,.panel{border:1px solid var(--line);background:var(--panel);border-radius:17px;padding:18px;margin:10px 0}.card{cursor:pointer;text-align:left;color:var(--txt);font:inherit;min-height:150px}.card strong{font-size:23px;display:block;margin-bottom:12px}.card:focus-visible,button:focus-visible{outline:3px solid var(--accent)}button{cursor:pointer}button.action,select,.pill{border:1px solid #7294b8;border-radius:10px;background:#284568;color:white;padding:10px 14px;font:inherit;margin:4px 4px 4px 0}.action.primary{background:#a3dfff;color:#0b2134;font-weight:700}.action:disabled{opacity:.55}textarea{display:block;width:100%;min-height:125px;border:1px solid #7e92ad;border-radius:10px;background:#101c30;color:white;padding:12px;font:inherit;margin:10px 0}label.choice{display:block;border:1px solid #536681;border-radius:10px;padding:10px;margin:8px 0}label.choice:has(input:checked){background:#315071}input[type=radio]{margin-right:10px}.tag{display:inline-block;border:1px solid #71839d;border-radius:20px;padding:2px 10px;font-size:12px;margin:2px}.hide{display:none!important}.correct{color:#9ceac5}.wrong{color:#ffb4b4}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.space{justify-content:space-between}.divider{border-top:1px solid #465b78;margin:14px 0}.stat{font-size:25px;font-weight:700}#notice{font-size:13px}footer{padding:25px;text-align:center;color:var(--muted)}
</style></head><body><header><h1>UCASS 2027 · 四科复习</h1><div>德语 · 英语文学史 737 · 专业英语 888 · 政治</div><small>可做题 · 可复习错题 · 本机自动保存</small></header><main><div id="home"><div class="panel"><h2>今日学习概览</h2><div id="stats"></div><div class="row"><button class="action" onclick="showHistory()">学习记录与错题</button><button class="action" onclick="showData()">备份与恢复</button></div></div><div class="grid" id="subjects"></div><p class="muted">说明：内置题目为原创示例，不标注为任何学校真题。数据仅保存在当前浏览器，清理浏览器数据可能导致丢失，请定期导出备份。</p></div><div id="study" class="hide"><div class="row"><button class="action" onclick="goHome()">← 返回首页</button><span id="subjectTitle"></span></div><div class="panel"><div class="row"><label>训练模式 <select id="mode" onchange="restart()"><option value="all">综合训练</option><option value="wrong">错题复习</option><option value="unseen">未练习题</option></select></label><label>题型 <select id="type" onchange="restart()"><option value="all">全部题型</option><option value="choice">选择题</option><option value="text">翻译 / 简答</option></select></label></div><div class="row"><button class="action" id="timerButton" onclick="toggleTimer()">开始 10 分钟计时</button><strong id="timer"></strong></div></div><div id="question" class="panel"></div><div class="row"><button class="action" onclick="prev()">上一题</button><button class="action" onclick="next()">下一题</button></div></div><div id="records" class="hide"><button class="action" onclick="goHome()">← 返回首页</button><div class="panel" id="recordsBody"></div></div><div id="data" class="hide"><button class="action" onclick="goHome()">← 返回首页</button><div class="panel"><h2>学习记录备份</h2><p>导出 JSON 后可以保存到手机；换设备时用下方导入恢复。不会自动同步到其他设备。</p><button class="action primary" onclick="exportData()">导出学习记录</button><label class="pill">导入 JSON 文件 <input type="file" accept=".json,application/json" onchange="importData(event)"></label><p id="dataStatus"></p></div></div></main><footer>UCASS 2027 · 可持续更新的基础训练版</footer><script>
const subjects=[['de','二外德语','A2 → B1 · 语法 / 词汇 / 翻译'],['lit','英语文学史 737','作家作品 / 文学术语 / 文本分析'],['trans','专业英语 888','英汉互译 / 汉英互译 / 限时训练'],['pol','政治','基础知识 / 概念辨析 / 简答']];
const bank=[
{id:'d1',s:'de',type:'choice',topic:'弱变化',q:'选择正确句子：Ich helfe ___ bei der Arbeit.',options:['dem Student','dem Studenten','den Student','der Studenten'],a:1,why:'Student 是阳性弱变化名词，第三格单数为 dem Studenten。'},
{id:'d2',s:'de',type:'choice',topic:'从句词序',q:'选择正确表达：我知道他今天必须工作。',options:['Ich weiß, dass er muss heute arbeiten.','Ich weiß, dass er heute arbeiten muss.','Ich weiß, dass muss er heute arbeiten.'],a:1,why:'dass 引导从句，变位动词 muss 位于句末，arbeiten 位于其前。'},
{id:'d3',s:'de',type:'text',topic:'zu-Infinitiv',q:'翻译成德语：我计划明年参加考试。',answer:'Ich habe vor, nächstes Jahr an der Prüfung teilzunehmen.',why:'vorhaben, ... zu + Infinitiv；teilnehmen an + D，且可分动词的 zu 放在前缀与词干之间：teilzunehmen。其他语义和语法正确的译法也可以。'},
{id:'d4',s:'de',type:'choice',topic:'动词搭配',q:'Er hält sich ___ die Regeln.',options:['an','auf','mit','für'],a:0,why:'sich an + Akkusativ halten 表示遵守；die Regeln 是第四格复数。'},
{id:'d5',s:'de',type:'text',topic:'被动态',q:'把句子改为 Vorgangspassiv：Man hat den Brief geschrieben.',answer:'Der Brief ist geschrieben worden.',why:'完成时过程被动：sein（完成时助动词）+ Partizip II + worden。'},
{id:'l1',s:'lit',type:'choice',topic:'诗歌格律',q:'Which form is traditionally associated with unrhymed iambic pentameter?',options:['Heroic couplet','Blank verse','Ottava rima','Terza rima'],a:1,why:'Blank verse is metrically regular, typically unrhymed iambic pentameter. A heroic couplet rhymes in pairs.'},
{id:'l2',s:'lit',type:'choice',topic:'文学史',q:'Who wrote The Faerie Queene?',options:['Philip Sidney','Edmund Spenser','John Milton','John Donne'],a:1,why:'Edmund Spenser wrote The Faerie Queene, an allegorical epic employing the Spenserian stanza.'},
{id:'l3',s:'lit',type:'text',topic:'戏剧术语',q:'In English, distinguish dramatic monologue from soliloquy in 2–4 sentences.',answer:'A dramatic monologue is a poem spoken by a fictional speaker to an implied or identifiable listener, revealing character through speech. A soliloquy is a dramatic speech in which a character speaks thoughts aloud, typically without addressing another character.',why:'重点：体裁与语境（诗歌 / 戏剧）、受话者、人物内心的呈现。不要仅把二者定义为“独白”。'},
{id:'l4',s:'lit',type:'choice',topic:'小说史',q:'Who described his novelistic form as a “comic epic-poem in prose”?',options:['Daniel Defoe','Henry Fielding','Samuel Richardson','Jonathan Swift'],a:1,why:'Henry Fielding used this formulation in the preface to Joseph Andrews; it is associated with his novelistic poetics.'},
{id:'l5',s:'lit',type:'text',topic:'莎士比亚',q:'Give two distinct functions of disguise or mistaken identity in Twelfth Night, with textual reference.',answer:'Disguise generates dramatic irony through Viola’s identity as Cesario, while mistaken identity intensifies comic confusion around Sebastian and Viola. Both expose the instability of outward appearances and complicate desire.',why:'高分要点：具体人物与情节 → 戏剧手法 → 主题意义；避免只写“creates humor”。'},
{id:'t1',s:'trans',type:'text',topic:'英译汉',q:'Translate into Chinese: The meaning of a literary work cannot be reduced to the author’s intention.',answer:'文学作品的意义不能被简化为作者的意图。',why:'cannot be reduced to = 不能归结为/简化为；注意抽象名词 meaning 的表达。'},
{id:'t2',s:'trans',type:'text',topic:'汉译英',q:'翻译：文学批评不仅关注作品写了什么，也关注它如何产生意义。',answer:'Literary criticism concerns itself not only with what a work says but also with how it produces meaning.',why:'not only ... but also ... 并列结构；what/how 引导宾语从句。译法不唯一。'},
{id:'t3',s:'trans',type:'text',topic:'英译汉',q:'Translate into Chinese: Historical circumstances shape literary forms, but they do not fully determine how readers interpret them.',answer:'历史环境塑造文学形式，但并不能完全决定读者如何理解这些形式。',why:'shape 不宜机械译为“形状”；do not fully determine 保留程度限制。'},
{id:'t4',s:'trans',type:'text',topic:'汉译英',q:'翻译：与其把人物视为固定不变的个体，不如考察其身份如何在社会关系中形成。',answer:'Rather than treating characters as fixed individuals, we should examine how their identities are formed through social relations.',why:'rather than + -ing；被动结构 are formed；注意 character 在文学语境下的含义。'},
{id:'p1',s:'pol',type:'choice',topic:'马克思主义基本原理',q:'在唯物辩证法中，事物发展的根本原因在于：',options:['事物的外部条件','事物的内部矛盾','主观愿望','偶然因素'],a:1,why:'内因是事物变化发展的根据；外因是条件，外因通过内因起作用。'},
{id:'p2',s:'pol',type:'choice',topic:'认识论',q:'实践在认识活动中的地位是：',options:['认识的唯一形式','认识的基础','与认识完全无关','仅是检验认识的一个可选标准'],a:1,why:'实践是认识的基础，包括认识的来源、动力、目的以及检验认识真理性的唯一标准。'},
{id:'p3',s:'pol',type:'text',topic:'辩证法',q:'简答：为什么说矛盾的普遍性和特殊性是辩证统一的？',answer:'矛盾普遍性寓于特殊性之中，并通过特殊性表现出来；特殊性离不开普遍性。二者在一定条件下可以相互转化。',why:'作答结构：定义关系 → 相互依存 → 条件下转化；可举具体问题具体分析的例子。'},
{id:'p4',s:'pol',type:'choice',topic:'政治经济学',q:'商品的二因素是：',options:['价值和价格','使用价值和价值','劳动和资本','供给和需求'],a:1,why:'商品具有使用价值和价值两个因素，分别与劳动的具体劳动和抽象劳动二重性相联系。'}
];
let saved;try{saved=JSON.parse(localStorage.getItem('ucass_records_v2')||'{}')}catch(e){saved={}}let state={subject:'de',list:[],i:0},tick=null,remaining=600;
function persist(){localStorage.setItem('ucass_records_v2',JSON.stringify(saved));renderStats()}
function hideAll(){['home','study','records','data'].forEach(x=>document.getElementById(x).classList.add('hide'))}function goHome(){stopTimer();hideAll();document.getElementById('home').classList.remove('hide');renderStats();window.scrollTo(0,0)}
function renderStats(){let vals=Object.values(saved),done=vals.filter(v=>v.attempts>0).length,correct=vals.filter(v=>v.status==='correct').length,wrong=vals.filter(v=>v.status==='wrong').length;document.getElementById('stats').innerHTML=`<div class="grid"><div><div class="stat">${done}/${bank.length}</div>已练习题目</div><div><div class="stat">${correct}</div>最近一次客观题正确 / 自评掌握</div><div><div class="stat">${wrong}</div>待复习错题</div></div>`}
function renderSubjects(){document.getElementById('subjects').innerHTML=subjects.map(([id,n,d])=>`<button class="card" onclick="openSubject('${id}')"><strong>${n}</strong><span>${d}</span><p class="muted">${bank.filter(q=>q.s===id).length} 道内置训练题 · 点击进入 →</p></button>`).join('')}
function openSubject(id){state.subject=id;document.getElementById('subjectTitle').textContent=subjects.find(s=>s[0]===id)[1];document.getElementById('mode').value='all';document.getElementById('type').value='all';hideAll();document.getElementById('study').classList.remove('hide');restart();window.scrollTo(0,0)}
function restart(){let mode=document.getElementById('mode').value,type=document.getElementById('type').value;state.list=bank.filter(q=>q.s===state.subject&&(type==='all'||q.type===type)&&(mode==='all'||(mode==='wrong'&&saved[q.id]?.status==='wrong')||(mode==='unseen'&&!saved[q.id]?.attempts)));state.i=0;renderQuestion()}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderQuestion(){let el=document.getElementById('question'),q=state.list[state.i];if(!q){el.innerHTML='<h2>当前筛选没有题目</h2><p>可以切换到“综合训练”，或选择其他题型。</p>';return}let record=saved[q.id],answered=record?.status;el.innerHTML=`<div class="row space"><span class="tag">${escapeHTML(q.topic)}</span><span>${state.i+1} / ${state.list.length}</span></div><h2>${q.type==='choice'?'选择题':'翻译 / 简答'}</h2><p>${escapeHTML(q.q)}</p>`+(q.type==='choice'?q.options.map((v,i)=>`<label class="choice"><input type="radio" name="answer" value="${i}">${escapeHTML(v)}</label>`).join(''):`<textarea id="written" placeholder="先写自己的答案，再查看参考答案。简答与翻译需自行核对。">${escapeHTML(record?.draft||'')}</textarea>`)+`<div class="row"><button class="action primary" onclick="submitAnswer()">${q.type==='choice'?'提交答案':'查看参考答案'}</button><button class="action" onclick="markReview()">标记待复习</button></div><div id="feedback"></div>`+(answered?`<p class="muted">上次记录：${record.status==='correct'?'正确 / 自评掌握':'待复习'} · 已练 ${record.attempts} 次</p>`:'')}
function submitAnswer(){let q=state.list[state.i];if(!q)return;let old=saved[q.id]||{attempts:0};if(q.type==='choice'){let checked=document.querySelector('input[name=answer]:checked');if(!checked){alert('请先选择一个答案');return}let ok=+checked.value===q.a;saved[q.id]={...old,attempts:old.attempts+1,status:ok?'correct':'wrong',date:new Date().toISOString()};persist();document.getElementById('feedback').innerHTML=`<div class="divider"></div><h3 class="${ok?'correct':'wrong'}">${ok?'回答正确':'回答错误'}</h3><p>正确答案：${escapeHTML(q.options[q.a])}</p><p>${escapeHTML(q.why)}</p>`}else{let draft=document.getElementById('written').value.trim();saved[q.id]={...old,draft,attempts:old.attempts+1,status:old.status||'wrong',date:new Date().toISOString()};persist();document.getElementById('feedback').innerHTML=`<div class="divider"></div><h3>参考答案（不自动判分）</h3><p>${escapeHTML(q.answer)}</p><p>${escapeHTML(q.why)}</p><div class="row"><button class="action" onclick="rateWritten(true)">我已掌握</button><button class="action" onclick="rateWritten(false)">还需复习</button></div>`}}
function rateWritten(ok){let q=state.list[state.i];saved[q.id].status=ok?'correct':'wrong';persist();document.getElementById('feedback').insertAdjacentHTML('beforeend',`<p class="${ok?'correct':'wrong'}">已保存自评：${ok?'掌握':'待复习'}</p>`)}
function markReview(){let q=state.list[state.i];if(!q)return;let old=saved[q.id]||{attempts:0};saved[q.id]={...old,status:'wrong',date:new Date().toISOString()};persist();alert('已加入错题复习')}
function next(){if(state.i<state.list.length-1){state.i++;renderQuestion();window.scrollTo(0,0)}else alert('已到本组最后一题')}function prev(){if(state.i>0){state.i--;renderQuestion();window.scrollTo(0,0)}}
function toggleTimer(){if(tick){stopTimer();return}remaining=600;document.getElementById('timerButton').textContent='停止计时';document.getElementById('timer').textContent='10:00';tick=setInterval(()=>{remaining--;document.getElementById('timer').textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;if(remaining<=0){stopTimer();alert('10 分钟训练时间到')}},1000)}function stopTimer(){if(tick)clearInterval(tick);tick=null;document.getElementById('timerButton').textContent='开始 10 分钟计时';document.getElementById('timer').textContent=''}
function showHistory(){hideAll();document.getElementById('records').classList.remove('hide');let entries=bank.filter(q=>saved[q.id]?.attempts);document.getElementById('recordsBody').innerHTML='<h2>学习记录与错题</h2><p>按最近一次答题结果统计；翻译和简答依赖自评。</p>'+(entries.length?entries.map(q=>`<div class="divider"></div><strong>${escapeHTML(subjects.find(s=>s[0]===q.s)[1])} · ${escapeHTML(q.topic)}</strong><p>${escapeHTML(q.q)}</p><p class="${saved[q.id].status==='wrong'?'wrong':'correct'}">${saved[q.id].status==='wrong'?'待复习':'已掌握'} · ${saved[q.id].attempts} 次</p><button class="action" onclick="openRecord('${q.id}')">重新练习</button>`).join(''):'<p>暂无记录，先进入任一科目练习。</p>')}
function openRecord(id){let q=bank.find(x=>x.id===id);openSubject(q.s);document.getElementById('mode').value='all';document.getElementById('type').value='all';restart();state.i=state.list.findIndex(x=>x.id===id);renderQuestion()}
function showData(){hideAll();document.getElementById('data').classList.remove('hide')}
function exportData(){let blob=new Blob([JSON.stringify({version:2,records:saved,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ucass-2027-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(ev){let file=ev.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.version!==2||!obj.records||typeof obj.records!=='object'||Array.isArray(obj.records))throw Error('文件格式不符合当前版本');if(!confirm('导入会覆盖当前浏览器的学习记录，确定继续？'))return;saved=obj.records;persist();document.getElementById('dataStatus').textContent='导入成功'}catch(e){document.getElementById('dataStatus').textContent='导入失败：'+e.message}ev.target.value=''}
renderSubjects();renderStats();
</script></body></html>

ackground:#e9f2ee;color:#17483e;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span id="site-version">正在检查网站版本…</span><button id="site-reload" type="button">重新加载最新内容</button></div><iframe id="study-frame" title="四科复习题库" src="./ucass2027-v6-7-integrated-ready.html"></iframe><script src="./literature-quality-patch.js"></script><script>(function(){const frame=document.getElementById('study-frame'),status=document.getElementById('site-version'),btn=document.getElementById('site-reload');function refresh(){frame.style.visibility='hidden';const u=new URL('./ucass2027-v6-7-integrated-ready.html',location.href);const target=new URLSearchParams(location.search).get('politics');if(target)u.searchParams.set('politics',target);u.searchParams.set('cache',String(Date.now()));frame.src=u.href;status.textContent='四科复习题库';}function tidyFrame(){try{const doc=frame.contentDocument;if(!doc)return;const fixSearch=()=>{for(const input of doc.querySelectorAll('input[placeholder]')){if(input.placeholder.includes('作者')&&input.placeholder.includes('题干'))input.placeholder='搜索关键词、知识点、题干…';}};fixSearch();if(!doc.__ucassSearchObserver){const observer=new MutationObserver(fixSearch);observer.observe(doc.body,{subtree:true,childList:true,attributes:true,attributeFilter:['placeholder']});doc.__ucassSearchObserver=observer;}const links=[...doc.querySelectorAll('a')];const labels=['课本精读','德语作文','英美文学知识库','四册考点'];const candidates=links.filter(a=>labels.includes(a.textContent.trim()));for(const a of candidates){const p=a.parentElement;if(!p)continue;const siblingLinks=[...p.querySelectorAll('a')];if(siblingLinks.length>=3&&siblingLinks.every(x=>labels.includes(x.textContent.trim()))&&p.textContent.trim().length<55){p.style.display='none';break;}}}catch(e){}}function hideLegacyNotice(){try{const doc=frame.contentDocument;if(!doc)return;const needle='每次下载的 HTML 文件可能使用独立的本地存储';const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);let node;while((node=walker.nextNode())){if(!node.nodeValue.includes(needle))continue;let el=node.parentElement;while(el&&el!==doc.body){const t=el.textContent.trim();if(t.includes(needle)&&t.length<330&&(!el.parentElement||el.parentElement.textContent.length>t.length+80))break;el=el.parentElement;}if(el&&el!==doc.body){el.style.display='none';}else{node.nodeValue=node.nodeValue.replace(/⚠?\\s*每次下载的 HTML 文件可能使用独立的本地存储[^。]*。?/,'');}break;}}catch(e){}}frame.addEventListener('load',()=>{tidyFrame();hideLegacyNotice();frame.style.visibility='visible';});btn.addEventListener('click',refresh);refresh();})();</script></body></html>

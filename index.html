<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UCASS 2027 · 四科复习</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#101522;color:#edf2fa;margin:0}header{padding:28px 20px;background:#1b2540}main{max-width:800px;margin:auto;padding:20px}h1{margin:0 0 8px}p{color:#b8c5db;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#1b2540;padding:18px;border-radius:16px;border:1px solid #33415e}button,select,textarea{font:inherit}button{background:#76a9ff;border:0;border-radius:9px;padding:9px 14px;margin:6px 5px 6px 0;color:#0d1830}textarea{box-sizing:border-box;width:100%;min-height:95px;background:#111a2e;color:white;border:1px solid #52617d;border-radius:8px;padding:10px}small{color:#9caec8}.tag{color:#a9d7ff}a{color:#9bc5ff}#entries{white-space:pre-wrap} .subject-card{cursor:pointer;text-align:left;width:100%;color:#edf2fa;display:block;margin:0;min-height:155px}.subject-card:focus-visible{outline:3px solid #76a9ff}.subject-card[aria-pressed="true"]{border-color:#76a9ff;background:#243653}.subject-card h2{margin-top:0}.subject-card small{display:block;margin-top:12px}#status{padding:10px 0;color:#a9d7ff}</style></head><body><header><h1>文学逻辑实验室 · UCASS 2027</h1><p>四科复习工作台｜先练习，再复盘，逐步建立真实学习记录</p></header><main><section class="grid" aria-label="选择复习科目">
<button class="card subject-card" data-subject="german" onclick="chooseSubject('german')" aria-pressed="false"><h2>二外德语</h2><p>语法 · 词汇 · 阅读 · 翻译 · 写作</p><span class="tag">A2 → B1</span></button>
<button class="card subject-card" data-subject="literature" onclick="chooseSubject('literature')" aria-pressed="false"><h2>英语文学史 737</h2><p>作家作品 · 术语 · 文本分析 · 真题</p><small>当前线上基础版：完整题库待更新</small></button>
<button class="card subject-card" data-subject="translation" onclick="chooseSubject('translation')" aria-pressed="false"><h2>专业英语 888</h2><p>文学英译汉 · 汉译英 · 文言文专项</p></button>
<button class="card subject-card" data-subject="politics" onclick="chooseSubject('politics')" aria-pressed="false"><h2>政治</h2><p>核心知识点 · 选择题 · 阶段任务</p></button>
</section><section class="card" style="margin-top:18px"><h2 id="training-title">今日训练</h2><p id="status" role="status">选择上方科目卡片进入训练。</p><p id="prompt"></p><textarea id="answer" placeholder="先写答案或分析，再保存。"></textarea><div><button onclick="save()">保存本次练习</button><button onclick="next()">换一道题</button></div><small>记录仅保存在当前浏览器中；清除浏览器数据或更换设备可能丢失。暂不自动判分。</small></section><section class="card" style="margin-top:18px"><h2>我的练习记录</h2><p id="count"></p><div id="entries"></div><button onclick="exportData()">导出记录 JSON</button></section><p><small>这是可运行的基础版。原网站的完整资料、真题题库和跨设备同步尚未恢复；后续可继续更新同一个 GitHub 仓库。</small></p></main><script>const qs=[
{subject:'german',label:'德语 · 语法',question:'将句子改为被动态：Man muss die Regeln einhalten.'},
{subject:'german',label:'德语 · 翻译',question:'将“与去年相比，越来越多的学生选择在大城市工作”译为德语。'},
{subject:'literature',label:'文学史 737 · 论述',question:'用英文解释 dramatic monologue 与 soliloquy 的区别，并各举一个例子。'},
{subject:'translation',label:'专业英语 888 · 英译汉',question:'Translate into Chinese: Literary interpretation depends not only on what a text says but also on how its language produces meaning.'},
{subject:'politics',label:'政治 · 简答',question:'简述实践与认识的辩证关系。'}
];
let logs=[];try{const value=JSON.parse(localStorage.getItem('ucass_logs')||'[]');if(Array.isArray(value))logs=value}catch(e){}
let subject=localStorage.getItem('ucass_subject')||'german';
let i=Number(localStorage.getItem('ucass_question')||0);if(!Number.isInteger(i)||i<0||i>=qs.length)i=0;
function indices(){return qs.map((q,j)=>q.subject===subject?j:-1).filter(j=>j>=0)}
function render(){const ix=indices();if(!ix.includes(i))i=ix[0];const q=qs[i];document.getElementById('training-title').textContent=q.label;document.getElementById('prompt').textContent=q.question;document.getElementById('status').textContent='当前科目：'+({german:'二外德语',literature:'英语文学史737',translation:'专业英语888',politics:'政治'}[subject])+' · 线上基础版共 '+ix.length+' 道示例题，完整题库尚未部署';document.querySelectorAll('.subject-card').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.subject===subject)));document.getElementById('count').textContent='已保存 '+logs.length+' 次练习';document.getElementById('entries').textContent=logs.slice(-8).reverse().map(x=>x.date+'｜'+x.subject+'\n'+x.answer).join('\n\n')||'暂无记录';localStorage.setItem('ucass_question',i)}
function chooseSubject(nextSubject){subject=nextSubject;localStorage.setItem('ucass_subject',subject);i=indices()[0];document.getElementById('answer').value='';render();document.getElementById('training-title').scrollIntoView({behavior:'smooth',block:'start'})}
function next(){const ix=indices();i=ix[(ix.indexOf(i)+1)%ix.length];document.getElementById('answer').value='';render()}
function save(){const answer=document.getElementById('answer').value.trim();if(!answer){alert('请先填写答案');return}logs.push({date:new Date().toLocaleString(),subject:qs[i].label,question:qs[i].question,answer});try{localStorage.setItem('ucass_logs',JSON.stringify(logs))}catch(e){alert('保存失败，请检查浏览器存储空间');return}document.getElementById('answer').value='';render()}
function exportData(){const b=new Blob([JSON.stringify(logs,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ucass-study-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();</script></body></html>

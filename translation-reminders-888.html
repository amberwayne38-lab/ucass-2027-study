<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专业英语888｜翻译知识点提醒</title><style>body{font:16px/1.65 system-ui,-apple-system,sans-serif;background:#f3f7f6;color:#193e3c;margin:0}main{max-width:900px;margin:auto;padding:20px}a{color:#17645b}article{background:white;border:1px solid #d5e3df;border-radius:12px;padding:17px;margin:14px 0}h1{font-size:26px}h2{font-size:19px}select,button,textarea{font:inherit;padding:9px;border:1px solid #9abcb3;border-radius:8px}button{background:#17645b;color:white;cursor:pointer}textarea{width:95%;min-height:85px}small{color:#536f69}.tag{font-size:12px;color:#34665e}.hidden{display:none}#status{font-weight:600}</style></head><body><main><p><a href="./index.html">← 返回原四科复习网站</a></p><h1>专业英语 888｜翻译知识点提醒</h1><p>按翻译方向与知识点训练。以下为原创教学例句，不标注为真题。练习记录仅保存在当前浏览器，不修改原题库记录。</p><label>翻译方向 <select id="direction"><option value="all">全部</option><option value="ce">汉译英</option><option value="ec">英译汉</option></select></label> <label>掌握状态 <select id="filter"><option value="all">全部</option><option value="new">未练习</option><option value="review">需复习</option><option value="mastered">已掌握</option></select></label><div id="items"></div></main><script>
const topics=[
{id:'passive-ce',direction:'ce',title:'主动→被动转换',rule:'汉语的泛指主语可根据英语语篇重心改写为被动；不要机械套用。',example:'人们普遍认为阅读有助于培养批判性思维。',answer:'It is widely believed that reading helps develop critical thinking.',note:'It is widely believed that 为形式主语结构；reading 作从句主语。'},
{id:'passive-ec',direction:'ec',title:'被动→主动转换',rule:'英语被动句翻译成汉语时，可根据施事者与表达习惯改成主动或无主句。',example:'The proposal was rejected after careful consideration.',answer:'经过慎重考虑，有关方面否决了这项提议。',note:'原句未明确施事者；也可译为“这项提议经慎重考虑后被否决”，不得擅自指定具体机构。'},
{id:'nominal-ce',direction:'ce',title:'动词→名词化',rule:'英语正式语体可使用名词化，但须避免冗长的空洞表达。',example:'政府实施这项政策有助于改善教育公平。',answer:'The implementation of this policy by the government can help improve educational equity.',note:'也可用 The government’s implementation...；implementation 是动词 implement 的名词形式。'},
{id:'nominal-ec',direction:'ec',title:'名词化→动词化',rule:'将英语抽象名词结构转换为自然的汉语动词表达。',example:'The rapid expansion of online education has transformed learning habits.',answer:'在线教育迅速扩展，改变了人们的学习习惯。',note:'expansion → 扩展；transformed → 改变。'},
{id:'split-ec',direction:'ec',title:'长句拆分与逻辑重组',rule:'先识别主干，再按因果、让步或修饰关系拆分，不遗漏限制条件。',example:'Although the findings remain preliminary, they suggest that sustained reading may improve students’ ability to evaluate complex arguments.',answer:'尽管这些研究结果仍属初步发现，但它们表明，持续阅读可能提高学生评估复杂论证的能力。',note:'保留 although 的让步关系和 may 的不确定性。'},
{id:'combine-ce',direction:'ce',title:'短句合并与从句',rule:'根据语义主次合并汉语短句，选择关系从句或分词结构。',example:'这本小说出版于十九世纪。它探讨了工业化对个人生活的影响。',answer:'Published in the nineteenth century, the novel explores the impact of industrialization on individual lives.',note:'过去分词 Published 修饰 novel；不能让分词逻辑主语错位。'},
{id:'negative-ce',direction:'ce',title:'否定与肯定转换',rule:'翻译时保持语义强度，注意双重否定和部分否定。',example:'这种现象并不少见。',answer:'This phenomenon is not uncommon.',note:'not uncommon 不是“极其普遍”，语气比 very common 更谨慎。'},
{id:'addition-ec',direction:'ec',title:'增译、省译与衔接',rule:'只为清晰表达隐含逻辑而增译，不添加原文未提供的事实。',example:'Given the limited evidence, the conclusion should be treated with caution.',answer:'鉴于现有证据有限，对这一结论应持谨慎态度。',note:'Given 表原因；the limited evidence 可译为“现有证据有限”。'}
];
const key='ucass888_translation_reminders_v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}function save(){localStorage.setItem(key,JSON.stringify(state))}function render(){const dir=document.getElementById('direction').value,f=document.getElementById('filter').value;document.getElementById('items').innerHTML=topics.filter(t=>(dir==='all'||dir===t.direction)&&(f==='all'||(state[t.id]||'new')===f)).map(t=>'<article><span class="tag">'+(t.direction==='ce'?'汉译英':'英译汉')+' · '+(state[t.id]==='mastered'?'已掌握':state[t.id]==='review'?'需复习':'未练习')+'</span><h2>'+t.title+'</h2><p><strong>翻译提醒：</strong>'+t.rule+'</p><p><strong>练习：</strong>'+t.example+'</p><textarea aria-label="输入翻译" placeholder="先尝试翻译，再查看参考答案"></textarea><p><button onclick="toggle(\''+t.id+'\')">查看／隐藏参考答案</button> <button onclick="mark(\''+t.id+'\',\'review\')">加入复习</button> <button onclick="mark(\''+t.id+'\',\'mastered\')">标记已掌握</button></p><div id="ans-'+t.id+'" class="hidden"><strong>参考译文：</strong>'+t.answer+'<p><strong>解析：</strong>'+t.note+'</p></div></article>').join('')||'<p>当前筛选条件下没有知识点。</p>'}function toggle(id){document.getElementById('ans-'+id).classList.toggle('hidden')}function mark(id,v){state[id]=v;save();render()}document.getElementById('direction').onchange=render;document.getElementById('filter').onchange=render;render();
</script></body></html>
